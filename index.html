<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quran Audio Player</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,300;0,400;0,500;1,400&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0d0d0d;
      --bg-2: #111;
      --bg-card: #161616;
      --bg-user: #1d2733;
      --text: #e8e8e8;
      --text-muted: #7c7c7c;
      --text-arabic: #f0ead6;
      --border: rgba(255, 255, 255, 0.1);
      --accent: #c8a96e;
      --error: #e05c5c;
    }

    html, body { height: 100%; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'IBM Plex Sans', sans-serif;
      font-size: 15px;
    }

    .app { display: flex; height: 100vh; overflow: hidden; }

    /* ── Sidebar ── */
    .sidebar {
      width: 264px;
      flex-shrink: 0;
      background: var(--bg-2);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      transition: transform 0.2s ease;
    }

    .sidebar-head {
      padding: 0.9rem;
      border-bottom: 1px solid var(--border);
    }

    .brand {
      font-size: 0.9rem;
      color: var(--accent);
      letter-spacing: 0.05em;
      margin-bottom: 0.8rem;
      padding: 0 0.2rem;
    }

    .new-chat {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.55rem 0.75rem;
      color: var(--text);
      font-family: inherit;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.15s;
    }
    .new-chat:hover { border-color: var(--accent); color: var(--accent); }
    .new-chat svg { width: 15px; height: 15px; }

    .chat-list { flex: 1; overflow-y: auto; padding: 0.5rem; }

    .chat-item {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.55rem 0.6rem;
      border-radius: 7px;
      color: var(--text-muted);
      font-size: 0.83rem;
      cursor: pointer;
      white-space: nowrap;
      overflow: hidden;
      transition: background 0.12s, color 0.12s;
    }
    .chat-item:hover { background: rgba(255, 255, 255, 0.04); color: var(--text); }
    .chat-item.active { background: rgba(200, 169, 110, 0.12); color: var(--text); }
    .chat-item .title { flex: 1; overflow: hidden; text-overflow: ellipsis; }
    .chat-item .del {
      opacity: 0;
      background: none; border: none; color: var(--text-muted);
      cursor: pointer; font-size: 1rem; line-height: 1; padding: 0 2px;
      flex-shrink: 0;
    }
    .chat-item:hover .del { opacity: 0.6; }
    .chat-item .del:hover { opacity: 1; color: var(--error); }

    /* ── Main column ── */
    .main { flex: 1; display: flex; flex-direction: column; min-width: 0; }

    .topbar {
      height: 52px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 0.6rem;
      padding: 0 1rem;
      border-bottom: 1px solid var(--border);
    }
    .topbar .menu-btn {
      display: none;
      background: none; border: 1px solid var(--border);
      border-radius: 7px; color: var(--text);
      width: 34px; height: 34px; cursor: pointer;
      align-items: center; justify-content: center;
    }
    .topbar .chat-title {
      font-size: 0.9rem; color: var(--text);
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 1.5rem 1rem 1rem;
    }
    .messages-inner { max-width: 720px; margin: 0 auto; display: flex; flex-direction: column; gap: 1.1rem; }

    /* ── Empty state ── */
    .empty {
      max-width: 620px; margin: 8vh auto 0; text-align: center;
    }
    .empty h2 { font-weight: 400; color: var(--accent); font-size: 1.3rem; letter-spacing: 0.04em; }
    .empty p { color: var(--text-muted); font-size: 0.9rem; margin: 0.6rem 0 1.6rem; }
    .examples { display: flex; flex-wrap: wrap; gap: 0.5rem; justify-content: center; }
    .example {
      background: var(--bg-card); border: 1px solid var(--border); border-radius: 20px;
      padding: 0.4rem 0.9rem; color: var(--text-muted); font-size: 0.82rem;
      cursor: pointer; transition: all 0.15s; font-family: inherit;
    }
    .example:hover { border-color: var(--accent); color: var(--accent); }

    /* ── Message bubbles ── */
    .msg { display: flex; }
    .msg.user { justify-content: flex-end; }
    .bubble-user {
      background: var(--bg-user);
      border: 1px solid rgba(120, 160, 200, 0.18);
      border-radius: 14px 14px 4px 14px;
      padding: 0.6rem 0.9rem;
      max-width: 80%;
      font-size: 0.92rem;
      line-height: 1.5;
    }
    .msg.assistant { justify-content: flex-start; }
    .assistant-wrap { max-width: 92%; width: 100%; }
    .assistant-line {
      font-size: 0.86rem; color: var(--text-muted); margin-bottom: 0.5rem;
      display: flex; align-items: center; gap: 0.4rem;
    }
    .assistant-line.err { color: var(--error); }

    /* ── Player card ── */
    .player-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.3rem;
    }
    .player-card.active { border-color: rgba(200, 169, 110, 0.45); }

    .pc-meta { display: flex; justify-content: space-between; align-items: flex-start; gap: 0.75rem; margin-bottom: 1rem; }
    .pc-ref { font-family: monospace; font-size: 0.88rem; font-weight: 500; color: var(--accent); display: block; }
    .pc-sub { display: block; font-size: 0.72rem; color: var(--text-muted); margin-top: 0.15rem; }
    .pc-badges { display: flex; flex-wrap: wrap; gap: 0.3rem; justify-content: flex-end; }
    .badge {
      font-size: 0.66rem; letter-spacing: 0.03em;
      border: 1px solid var(--border); border-radius: 12px;
      padding: 0.12rem 0.5rem; color: var(--text-muted); white-space: nowrap;
    }
    .badge.on { border-color: rgba(200, 169, 110, 0.5); color: var(--accent); }

    .pc-arabic {
      font-family: 'IBM Plex Sans Arabic', sans-serif;
      font-size: 1.7rem; line-height: 1.9; color: var(--text-arabic);
      direction: rtl; text-align: right;
      border-top: 1px solid var(--border); border-bottom: 1px solid var(--border);
      padding: 1.1rem 0.15rem; margin-bottom: 0.9rem;
      min-height: 2.5rem;
    }
    .pc-trans { font-size: 0.85rem; line-height: 1.7; color: var(--text-muted); font-style: italic; }
    .pc-status { font-size: 0.78rem; color: var(--text-muted); margin-top: 0.4rem; min-height: 0; }
    .pc-status.err { color: var(--error); }

    .pc-controls {
      display: flex; align-items: center; justify-content: center; gap: 1rem;
      margin-top: 1.2rem; padding-top: 1rem; border-top: 1px solid var(--border);
    }
    .ctrl-btn {
      background: transparent; border: 1px solid var(--border); border-radius: 50%;
      width: 38px; height: 38px; display: flex; align-items: center; justify-content: center;
      color: var(--text); cursor: pointer; transition: all 0.15s; flex-shrink: 0;
    }
    .ctrl-btn:hover { border-color: rgba(255, 255, 255, 0.28); background: rgba(255, 255, 255, 0.04); }
    .ctrl-btn.primary { width: 48px; height: 48px; background: var(--accent); border-color: var(--accent); color: #0d0d0d; }
    .ctrl-btn.primary:hover { opacity: 0.85; background: var(--accent); }

    .seek-row { display: flex; align-items: center; gap: 0.6rem; margin-top: 0.9rem; }
    .time { font-family: monospace; font-size: 0.7rem; color: var(--text-muted); min-width: 34px; }
    .time.end { text-align: right; }
    .seek-bar {
      flex: 1; -webkit-appearance: none; appearance: none; height: 3px;
      background: rgba(255, 255, 255, 0.12); border-radius: 2px; outline: none; cursor: pointer;
    }
    .seek-bar::-webkit-slider-thumb { -webkit-appearance: none; width: 12px; height: 12px; border-radius: 50%; background: var(--accent); cursor: pointer; }
    .seek-bar::-moz-range-thumb { width: 12px; height: 12px; border-radius: 50%; background: var(--accent); border: none; cursor: pointer; }

    /* ── Composer ── */
    .composer-wrap { flex-shrink: 0; border-top: 1px solid var(--border); padding: 0.85rem 1rem 1.1rem; }
    .composer { max-width: 720px; margin: 0 auto; display: flex; gap: 0.5rem; }
    .composer input {
      flex: 1; background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px;
      padding: 0.75rem 1rem; color: var(--text); font-family: inherit; font-size: 0.95rem; outline: none;
      transition: border-color 0.2s;
    }
    .composer input::placeholder { color: var(--text-muted); }
    .composer input:focus { border-color: rgba(200, 169, 110, 0.6); }
    .send-btn {
      background: var(--accent); border: none; border-radius: 10px; width: 46px;
      color: #0d0d0d; cursor: pointer; display: flex; align-items: center; justify-content: center;
      transition: opacity 0.15s;
    }
    .send-btn:hover { opacity: 0.85; }
    .composer-hint { max-width: 720px; margin: 0.5rem auto 0; font-size: 0.72rem; color: var(--text-muted); text-align: center; }

    .backdrop { display: none; }

    /* ── Mobile ── */
    @media (max-width: 760px) {
      .sidebar {
        position: fixed; top: 0; left: 0; bottom: 0; z-index: 30;
        transform: translateX(-100%);
      }
      .sidebar.open { transform: translateX(0); }
      .topbar .menu-btn { display: flex; }
      .backdrop.show { display: block; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 20; }
      .pc-arabic { font-size: 1.45rem; }
    }
  </style>
</head>
<body>
  <div class="app">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-head">
        <div class="brand">Quran Audio Player</div>
        <button class="new-chat" id="newChatBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          New chat
        </button>
      </div>
      <div class="chat-list" id="chatList"></div>
    </aside>

    <div class="backdrop" id="backdrop"></div>

    <!-- Main -->
    <main class="main">
      <div class="topbar">
        <button class="menu-btn" id="menuBtn" title="Menu">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
        <span class="chat-title" id="chatTitle">New chat</span>
      </div>

      <div class="messages" id="messages"></div>

      <div class="composer-wrap">
        <div class="composer">
          <input id="composerInput" type="text" autocomplete="off" spellcheck="false"
                 placeholder="Try: play Al-Araf 132-134 on repeat at 1.5x">
          <button class="send-btn" id="sendBtn" title="Send">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
          </button>
        </div>
        <div class="composer-hint">Say a surah name/number, a verse or range, and optionally a reciter, “on repeat”, and a speed like “1.5x”.</div>
      </div>
    </main>
  </div>

  <audio id="audio" preload="none"></audio>

  <script>
    /* ══════════════════════════════════════════════════════════════
       Reciters — candidate audio sources tried in order (failover)
    ══════════════════════════════════════════════════════════════ */
    const RECITERS = {
      Alafasy:       { name: 'Mishary Alafasy',   everyayah: ['Alafasy_128kbps'], qcom: 'Alafasy' },
      AbdulBaset:    { name: 'Abdul Basit',        everyayah: ['Abdul_Basit_Murattal_64kbps', 'Abdul_Basit_Murattal_192kbps'], qcom: 'AbdulBaset/Murattal' },
      Husary:        { name: 'Mahmoud Al-Husary',  everyayah: ['Husary_128kbps', 'Husary_64kbps'], qcom: 'Husary' },
      AbuBakrShatri: { name: 'Abu Bakr Al-Shatri', everyayah: ['Abu_Bakr_Ash-Shaatree_128kbps', 'Abu_Bakr_Ash-Shaatree_64kbps'], qcom: 'Shatri' },
    };

    /* ══════════════════════════════════════════════════════════════
       Surah names (1–114)
    ══════════════════════════════════════════════════════════════ */
    const SURAH_NAMES = [
      null,
      'Al-Fatihah','Al-Baqarah','Ali ‘Imran','An-Nisa','Al-Ma’idah',
      'Al-An’am','Al-A’raf','Al-Anfal','At-Tawbah','Yunus',
      'Hud','Yusuf','Ar-Ra’d','Ibrahim','Al-Hijr',
      'An-Nahl','Al-Isra','Al-Kahf','Maryam','Ta-Ha',
      'Al-Anbiya','Al-Hajj','Al-Mu’minun','An-Nur','Al-Furqan',
      'Ash-Shu’ara','An-Naml','Al-Qasas','Al-‘Ankabut','Ar-Rum',
      'Luqman','As-Sajdah','Al-Ahzab','Saba','Fatir',
      'Ya-Sin','As-Saffat','Sad','Az-Zumar','Ghafir',
      'Fussilat','Ash-Shura','Az-Zukhruf','Ad-Dukhan','Al-Jathiyah',
      'Al-Ahqaf','Muhammad','Al-Fath','Al-Hujurat','Qaf',
      'Adh-Dhariyat','At-Tur','An-Najm','Al-Qamar','Ar-Rahman',
      'Al-Waqi’ah','Al-Hadid','Al-Mujadila','Al-Hashr','Al-Mumtahanah',
      'As-Saff','Al-Jumu’ah','Al-Munafiqun','At-Taghabun','At-Talaq',
      'At-Tahrim','Al-Mulk','Al-Qalam','Al-Haqqah','Al-Ma’arij',
      'Nuh','Al-Jinn','Al-Muzzammil','Al-Muddaththir','Al-Qiyamah',
      'Al-Insan','Al-Mursalat','An-Naba','An-Nazi’at','‘Abasa',
      'At-Takwir','Al-Infitar','Al-Mutaffifin','Al-Inshiqaq','Al-Buruj',
      'At-Tariq','Al-A’la','Al-Ghashiyah','Al-Fajr','Al-Balad',
      'Ash-Shams','Al-Layl','Ad-Duha','Ash-Sharh','At-Tin',
      'Al-‘Alaq','Al-Qadr','Al-Bayyinah','Az-Zalzalah','Al-‘Adiyat',
      'Al-Qari’ah','At-Takathur','Al-‘Asr','Al-Humazah','Al-Fil',
      'Quraysh','Al-Ma’un','Al-Kawthar','Al-Kafirun','An-Nasr',
      'Al-Masad','Al-Ikhlas','Al-Falaq','An-Nas',
    ];

    const NAME_LOOKUP = (() => {
      const map = {};
      const norm = s => s.toLowerCase().replace(/[^a-z0-9]/g, '');
      const articles = ['ash', 'adh', 'ath', 'al', 'ad', 'ar', 'as', 'at', 'an', 'az'];
      const strip = n => {
        for (const a of articles) if (n.startsWith(a) && n.length > a.length + 1) return n.slice(a.length);
        return n;
      };
      for (let i = 1; i < SURAH_NAMES.length; i++) {
        const n = norm(SURAH_NAMES[i]);
        if (!(n in map)) map[n] = i;
        const s = strip(n);
        if (!(s in map)) map[s] = i;
      }
      const aliases = {
        yaseen: 36, yasin: 36, taha: 20, fatiha: 1, fatihah: 1, ikhlas: 112,
        kafiroon: 109, muminoon: 23, imran: 3, alimran: 3, aleimran: 3,
        kursi: 2, ayatulkursi: 2, ayatalkursi: 2,
      };
      for (const k in aliases) if (!(k in map)) map[k] = aliases[k];
      return map;
    })();

    function resolveSurah(token) {
      const t = (token || '').trim();
      if (!t) return null;
      if (/^\d+$/.test(t)) { const n = parseInt(t, 10); return (n >= 1 && n <= 114) ? n : null; }
      let key = t.toLowerCase().replace(/[^a-z0-9]/g, '');
      key = key.replace(/^(surahs?|surat|chapters?|chap)/, '') || key;
      if (key in NAME_LOOKUP) return NAME_LOOKUP[key];
      const articles = ['ash', 'adh', 'ath', 'al', 'ad', 'ar', 'as', 'at', 'an', 'az'];
      for (const a of articles) if (key.startsWith(a)) { const s = key.slice(a.length); if (s in NAME_LOOKUP) return NAME_LOOKUP[s]; }
      return null;
    }

    /* ══════════════════════════════════════════════════════════════
       Reference parser (surah + ayah range) and command parser
       (adds reciter, repeat, speed).
    ══════════════════════════════════════════════════════════════ */
    function parseRef(raw) {
      let s = (raw || '').trim();
      if (!s) return null;
      s = s.replace(/^\s*(please\s+)?(play|recite|read|listen(\s+to)?|open|start|put\s+on)\s+/i, '');
      s = s.replace(/\bto\b/gi, '-').replace(/[–—]/g, '-');

      let surahTok, ayahPart;
      const colon = s.indexOf(':');
      if (colon !== -1) {
        surahTok = s.slice(0, colon).trim();
        ayahPart = s.slice(colon + 1).trim();
      } else {
        const m = s.match(/\d+/);
        if (!m) { const only = resolveSurah(s); return only ? { surah: only, start: 1, end: 1 } : null; }
        const before = s.slice(0, m.index).trim();
        if (before) { surahTok = before; ayahPart = s.slice(m.index).trim(); }
        else { surahTok = m[0]; ayahPart = s.slice(m.index + m[0].length).trim(); }
      }

      const surah = resolveSurah(surahTok);
      if (!surah) return null;

      const nums = ayahPart.match(/\d+/g);
      if (!nums || nums.length === 0) return { surah, start: 1, end: 1 };
      let start = parseInt(nums[0], 10);
      let end = start;
      if (/-/.test(ayahPart) && nums.length >= 2) end = parseInt(nums[nums.length - 1], 10);
      if (!Number.isInteger(start) || start < 1) return null;
      if (end < start) end = start;
      if (end - start > 285) end = start + 285;
      return { surah, start, end };
    }

    function parseCommand(raw, defaultSlug) {
      let rest = ' ' + (raw || '').trim() + ' ';
      let speed = null, repeat = false, slug = null;

      // ── speed ──
      let m = rest.match(/(\d+(?:\.\d+)?)\s*[x×]/i);
      if (!m) m = rest.match(/\b(?:at|speed)\s+(\d+(?:\.\d+)?)\b/i);
      if (m) { speed = parseFloat(m[1]); rest = rest.replace(m[0], ' '); }
      else if (/\bhalf\s+speed\b/i.test(rest)) { speed = 0.5; rest = rest.replace(/\bhalf\s+speed\b/i, ' '); }
      else if (/\b(double|twice)\s+speed\b/i.test(rest)) { speed = 2; rest = rest.replace(/\b(double|twice)\s+speed\b/i, ' '); }
      else if (/\bnormal\s+speed\b/i.test(rest)) { speed = 1; rest = rest.replace(/\bnormal\s+speed\b/i, ' '); }

      // ── repeat ──
      const rep = rest.match(/\bon\s+repeat\b|\brepeatedly\b|\brepeat\b|\bon\s+loop\b|\blooping\b|\bloop\b/i);
      if (rep) { repeat = true; rest = rest.replace(rep[0], ' '); }

      // ── reciter ──
      const recPatterns = [
        [/\b(mishary|alafasy|afasy|al-?afasy)\b/i, 'Alafasy'],
        [/\b(abdul[\s-]?basit|abdulbasit|basit|abdul[\s-]?basset)\b/i, 'AbdulBaset'],
        [/\b(husary|husri|al-?husary)\b/i, 'Husary'],
        [/\b(shatri|shaatree|abu[\s-]?bakr)\b/i, 'AbuBakrShatri'],
      ];
      for (const [re, val] of recPatterns) if (re.test(rest)) { slug = val; rest = rest.replace(re, ' '); }
      rest = rest.replace(/\b(recited\s+by|reciter|by)\b/gi, ' ');

      if (speed != null) { if (!isFinite(speed) || speed <= 0) speed = 1; speed = Math.min(4, Math.max(0.25, speed)); }

      const ref = parseRef(rest);
      if (!ref) return { error: true };
      // "Ayat al-Kursi" is specifically 2:255 (unless explicit ayah given).
      if (/\bkursi\b/i.test(raw) && ref.surah === 2 && !/\d/.test(rest)) { ref.start = 255; ref.end = 255; }
      return {
        spec: {
          surah: ref.surah, start: ref.start, end: ref.end,
          slug: slug || defaultSlug || 'Alafasy',
          speed: speed == null ? 1 : speed,
          repeat,
        },
      };
    }

    /* ══════════════════════════════════════════════════════════════
       Small helpers
    ══════════════════════════════════════════════════════════════ */
    const pad3 = n => String(n).padStart(3, '0');
    const uid = () => 'c' + Math.random().toString(36).slice(2, 9) + Date.now().toString(36);

    function formatTime(sec) {
      if (!isFinite(sec) || isNaN(sec)) return '0:00';
      const m = Math.floor(sec / 60), s = Math.floor(sec % 60);
      return `${m}:${String(s).padStart(2, '0')}`;
    }
    function stripHtml(raw) { return raw.replace(/<[^>]+>/g, '').replace(/\[\d+\]/g, '').trim(); }

    function specTitle(spec) {
      const name = SURAH_NAMES[spec.surah] || `Surah ${spec.surah}`;
      const range = spec.end > spec.start ? `${spec.surah}:${spec.start}–${spec.end}` : `${spec.surah}:${spec.start}`;
      return { name, range };
    }
    function specSummary(spec) {
      const { name, range } = specTitle(spec);
      const bits = [`${name} · ${range}`, RECITERS[spec.slug]?.name || spec.slug];
      if (spec.speed !== 1) bits.push(`${spec.speed}×`);
      if (spec.repeat) bits.push('on repeat');
      return 'Playing ' + bits.join(' · ');
    }

    function buildCandidates(surah, ayah, slug) {
      const r = RECITERS[slug] || {};
      const p = pad3(surah) + pad3(ayah);
      const list = [];
      (r.everyayah || []).forEach(f => list.push(`https://everyayah.com/data/${f}/${p}.mp3`));
      if (r.qcom) list.push(`https://verses.quran.com/${r.qcom}/mp3/${p}.mp3`);
      return list;
    }

    async function fetchVerseData(surah, ayah) {
      const url = `https://api.qurancdn.com/api/qdc/verses/by_key/${surah}:${ayah}`
                + `?language=en&words=false&translations=131&fields=text_uthmani`;
      const res = await fetch(url);
      if (!res.ok) throw new Error(`API ${res.status}`);
      const { verse } = await res.json();
      return {
        arabic: verse.text_uthmani || '',
        translation: verse.translations?.[0]?.text ? stripHtml(verse.translations[0].text) : '',
      };
    }

    /* ══════════════════════════════════════════════════════════════
       Persistence
    ══════════════════════════════════════════════════════════════ */
    const LS_KEY = 'quranChats_v1';
    let store = { order: [], chats: {} };
    let currentId = null;          // may reference an in-memory (unsaved) chat
    let draftChat = null;          // unsaved "New chat" until first message

    function loadStore() {
      try {
        const raw = localStorage.getItem(LS_KEY);
        if (raw) store = JSON.parse(raw);
        if (!store.order) store = { order: [], chats: {} };
      } catch { store = { order: [], chats: {} }; }
    }
    function saveStore() {
      try { localStorage.setItem(LS_KEY, JSON.stringify(store)); } catch {}
    }

    function currentChat() {
      if (draftChat && currentId === draftChat.id) return draftChat;
      return store.chats[currentId] || null;
    }

    /* ══════════════════════════════════════════════════════════════
       Audio engine (single element, bound to the active card)
    ══════════════════════════════════════════════════════════════ */
    const audio = document.getElementById('audio');
    const engine = {
      activeCard: null, spec: null, playlist: [], plIndex: 0,
      cands: [], candIndex: 0, intendPlay: true, token: 0,
    };
    const cardSpec = new WeakMap();   // card element → spec

    function refs(card) {
      return {
        card,
        ref:   card.querySelector('.pc-ref'),
        sub:   card.querySelector('.pc-sub'),
        arabic:card.querySelector('.pc-arabic'),
        trans: card.querySelector('.pc-trans'),
        status:card.querySelector('.pc-status'),
        play:  card.querySelector('.pc-play'),
        iPlay: card.querySelector('.i-play'),
        iPause:card.querySelector('.i-pause'),
        seek:  card.querySelector('.pc-seek'),
        cur:   card.querySelector('.pc-cur'),
        tot:   card.querySelector('.pc-tot'),
      };
    }
    function setCardPlaying(card, playing) {
      if (!card) return;
      const r = refs(card);
      r.iPlay.style.display  = playing ? 'none' : '';
      r.iPause.style.display = playing ? '' : 'none';
    }

    function activate(card, autoplay) {
      const spec = cardSpec.get(card);
      if (!spec) return;
      if (engine.activeCard && engine.activeCard !== card) {
        setCardPlaying(engine.activeCard, false);
        engine.activeCard.classList.remove('active');
      }
      engine.activeCard = card;
      card.classList.add('active');
      engine.spec = { ...spec };
      engine.playlist = [];
      for (let a = spec.start; a <= spec.end; a++) engine.playlist.push({ surah: spec.surah, ayah: a });
      engine.plIndex = 0;
      engineLoad(autoplay);
    }

    async function engineLoad(autoplay) {
      const card = engine.activeCard;
      if (!card) return;
      const r = refs(card);
      const item = engine.playlist[engine.plIndex];
      const { surah, ayah } = item;
      const myToken = ++engine.token;

      audio.pause();
      audio.removeAttribute('src');
      r.seek.value = 0; r.cur.textContent = '0:00'; r.tot.textContent = '0:00';
      setCardPlaying(card, false);
      r.status.textContent = 'Loading…'; r.status.className = 'pc-status';

      let vd;
      try { vd = await fetchVerseData(surah, ayah); }
      catch { if (myToken !== engine.token) return; r.status.textContent = 'Could not fetch verse text — check your connection.'; r.status.className = 'pc-status err'; return; }
      if (myToken !== engine.token) return;

      const { name } = specTitle(engine.spec);
      const first = engine.playlist[0].ayah, last = engine.playlist[engine.playlist.length - 1].ayah;
      r.ref.textContent = `${surah}:${ayah}`;
      r.sub.textContent = engine.playlist.length > 1 ? `${name} · ayah ${ayah} of ${first}–${last}` : name;
      r.arabic.textContent = vd.arabic;
      r.trans.textContent = vd.translation;
      r.status.textContent = '';

      engine.cands = buildCandidates(surah, ayah, engine.spec.slug);
      engine.candIndex = 0;
      engine.intendPlay = autoplay;
      playCandidate();
    }

    function playCandidate() {
      if (engine.candIndex >= engine.cands.length) return;
      audio.src = engine.cands[engine.candIndex];
      audio.load();
      audio.playbackRate = engine.spec.speed || 1;
      if (engine.intendPlay) audio.play().then(() => setCardPlaying(engine.activeCard, true)).catch(() => {});
    }

    audio.addEventListener('error', () => {
      if (!audio.src) return;
      if (engine.candIndex < engine.cands.length - 1) { engine.candIndex++; playCandidate(); return; }
      if (engine.activeCard) {
        const r = refs(engine.activeCard);
        r.status.textContent = 'Could not load audio from any source. Try a different reciter.';
        r.status.className = 'pc-status err';
        setCardPlaying(engine.activeCard, false);
      }
    });
    audio.addEventListener('play',  () => { audio.playbackRate = engine.spec?.speed || 1; setCardPlaying(engine.activeCard, true); });
    audio.addEventListener('pause', () => setCardPlaying(engine.activeCard, false));
    audio.addEventListener('durationchange', () => {
      if (engine.activeCard && isFinite(audio.duration)) refs(engine.activeCard).tot.textContent = formatTime(audio.duration);
    });
    audio.addEventListener('timeupdate', () => {
      if (!engine.activeCard || !isFinite(audio.duration)) return;
      const r = refs(engine.activeCard);
      if (r.seek.dataset.seeking === '1') return;
      r.seek.value = (audio.currentTime / audio.duration) * 100;
      r.cur.textContent = formatTime(audio.currentTime);
    });
    audio.addEventListener('ended', () => {
      if (engine.plIndex < engine.playlist.length - 1) { engine.plIndex++; engineLoad(true); }
      else if (engine.spec?.repeat) { engine.plIndex = 0; engineLoad(true); }
      else setCardPlaying(engine.activeCard, false);
    });

    /* ══════════════════════════════════════════════════════════════
       Rendering
    ══════════════════════════════════════════════════════════════ */
    const messagesEl = document.getElementById('messages');
    const chatListEl = document.getElementById('chatList');
    const chatTitleEl = document.getElementById('chatTitle');
    const composer = document.getElementById('composerInput');

    const ICON_PREV = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="19 20 9 12 19 4 19 20"/><line x1="5" y1="19" x2="5" y2="5"/></svg>';
    const ICON_NEXT = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 4 15 12 5 20 5 4"/><line x1="19" y1="5" x2="19" y2="19"/></svg>';
    const ICON_PLAY = '<svg class="i-play" width="17" height="17" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>';
    const ICON_PAUSE = '<svg class="i-pause" width="17" height="17" viewBox="0 0 24 24" fill="currentColor" style="display:none"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>';

    function createPlayerCard(spec) {
      const card = document.createElement('div');
      card.className = 'player-card';
      const badges = [`<span class="badge">${RECITERS[spec.slug]?.name || spec.slug}</span>`];
      if (spec.speed !== 1) badges.push(`<span class="badge on">${spec.speed}×</span>`);
      if (spec.repeat) badges.push(`<span class="badge on">↻ repeat</span>`);
      const { name, range } = specTitle(spec);
      card.innerHTML = `
        <div class="pc-meta">
          <div><span class="pc-ref">${range}</span><span class="pc-sub">${name}</span></div>
          <div class="pc-badges">${badges.join('')}</div>
        </div>
        <div class="pc-arabic" dir="rtl" lang="ar"></div>
        <div class="pc-trans"></div>
        <div class="pc-status"></div>
        <div class="pc-controls">
          <button class="ctrl-btn pc-prev" title="Previous ayah">${ICON_PREV}</button>
          <button class="ctrl-btn primary pc-play" title="Play / Pause">${ICON_PLAY}${ICON_PAUSE}</button>
          <button class="ctrl-btn pc-next" title="Next ayah">${ICON_NEXT}</button>
        </div>
        <div class="seek-row">
          <span class="time pc-cur">0:00</span>
          <input class="seek-bar pc-seek" type="range" min="0" max="100" value="0" step="0.1">
          <span class="time end pc-tot">0:00</span>
        </div>`;
      cardSpec.set(card, spec);
      wireCard(card);
      return card;
    }

    function wireCard(card) {
      const playBtn = card.querySelector('.pc-play');
      const prevBtn = card.querySelector('.pc-prev');
      const nextBtn = card.querySelector('.pc-next');
      const seek = card.querySelector('.pc-seek');

      playBtn.addEventListener('click', () => {
        if (engine.activeCard === card && audio.src) {
          if (audio.paused) audio.play().catch(() => {}); else audio.pause();
        } else {
          activate(card, true);
        }
      });
      prevBtn.addEventListener('click', () => {
        if (engine.activeCard !== card) { activate(card, true); return; }
        if (engine.plIndex > 0) { engine.plIndex--; engineLoad(true); }
        else { const c = engine.playlist[0]; if (c.ayah > 1) { engine.playlist.unshift({ surah: c.surah, ayah: c.ayah - 1 }); engineLoad(true); } }
      });
      nextBtn.addEventListener('click', () => {
        if (engine.activeCard !== card) { activate(card, true); return; }
        if (engine.plIndex < engine.playlist.length - 1) { engine.plIndex++; engineLoad(true); }
        else { const c = engine.playlist[engine.plIndex]; engine.playlist.push({ surah: c.surah, ayah: c.ayah + 1 }); engine.plIndex++; engineLoad(true); }
      });
      seek.addEventListener('mousedown', () => { seek.dataset.seeking = '1'; });
      seek.addEventListener('touchstart', () => { seek.dataset.seeking = '1'; }, { passive: true });
      seek.addEventListener('input', () => {
        if (engine.activeCard === card && isFinite(audio.duration))
          card.querySelector('.pc-cur').textContent = formatTime((seek.value / 100) * audio.duration);
      });
      seek.addEventListener('change', () => {
        seek.dataset.seeking = '0';
        if (engine.activeCard === card && isFinite(audio.duration)) audio.currentTime = (seek.value / 100) * audio.duration;
      });
    }

    function renderMessages() {
      const chat = currentChat();
      messagesEl.innerHTML = '';
      engine.activeCard = null;
      chatTitleEl.textContent = chat ? chat.title : 'New chat';

      if (!chat || chat.messages.length === 0) { renderEmpty(); return; }

      const inner = document.createElement('div');
      inner.className = 'messages-inner';
      let lastCard = null;
      for (const msg of chat.messages) {
        if (msg.role === 'user') {
          const row = document.createElement('div');
          row.className = 'msg user';
          row.innerHTML = `<div class="bubble-user"></div>`;
          row.querySelector('.bubble-user').textContent = msg.text;
          inner.appendChild(row);
        } else {
          const row = document.createElement('div');
          row.className = 'msg assistant';
          const wrap = document.createElement('div');
          wrap.className = 'assistant-wrap';
          const line = document.createElement('div');
          line.className = 'assistant-line' + (msg.error ? ' err' : '');
          line.textContent = msg.summary;
          wrap.appendChild(line);
          if (msg.spec) { const c = createPlayerCard(msg.spec); wrap.appendChild(c); lastCard = c; }
          row.appendChild(wrap);
          inner.appendChild(row);
        }
      }
      messagesEl.appendChild(inner);
      messagesEl.scrollTop = messagesEl.scrollHeight;
      return lastCard;
    }

    function renderEmpty() {
      const examples = [
        'Play Al-Fatihah',
        'Al-Araf 132-134 on repeat at 1.5x',
        'Ayat al-Kursi by Husary',
        'Ya-Sin 1-5 at 1.25x',
      ];
      const wrap = document.createElement('div');
      wrap.className = 'empty';
      wrap.innerHTML = `
        <h2>Quran Audio Player</h2>
        <p>Ask in plain language — pick a reciter, a verse or range, repeat, and speed.</p>
        <div class="examples">${examples.map(e => `<button class="example">${e}</button>`).join('')}</div>`;
      wrap.querySelectorAll('.example').forEach(b =>
        b.addEventListener('click', () => { send(b.textContent); }));
      messagesEl.appendChild(wrap);
    }

    function renderSidebar() {
      chatListEl.innerHTML = '';
      // Unsaved draft shows at the top.
      if (draftChat && currentId === draftChat.id) {
        chatListEl.appendChild(sidebarItem(draftChat.id, 'New chat', true));
      }
      for (const id of store.order) {
        const chat = store.chats[id];
        if (!chat) continue;
        chatListEl.appendChild(sidebarItem(id, chat.title, id === currentId));
      }
    }
    function sidebarItem(id, title, active) {
      const el = document.createElement('div');
      el.className = 'chat-item' + (active ? ' active' : '');
      el.innerHTML = `<span class="title"></span><button class="del" title="Delete">×</button>`;
      el.querySelector('.title').textContent = title;
      el.querySelector('.title').addEventListener('click', () => openChat(id));
      el.addEventListener('click', e => { if (!e.target.classList.contains('del')) openChat(id); });
      el.querySelector('.del').addEventListener('click', e => { e.stopPropagation(); deleteChat(id); });
      return el;
    }

    /* ══════════════════════════════════════════════════════════════
       Chat actions
    ══════════════════════════════════════════════════════════════ */
    function newChat() {
      draftChat = { id: uid(), title: 'New chat', createdAt: Date.now(), messages: [] };
      currentId = draftChat.id;
      audio.pause();
      renderSidebar();
      renderMessages();
      composer.focus();
      closeSidebarMobile();
    }
    function openChat(id) {
      if (draftChat && id !== draftChat.id && draftChat.messages.length === 0) draftChat = null;
      currentId = id;
      audio.pause();
      renderSidebar();
      renderMessages();
      closeSidebarMobile();
    }
    function deleteChat(id) {
      delete store.chats[id];
      store.order = store.order.filter(x => x !== id);
      saveStore();
      if (currentId === id) {
        if (store.order.length) openChat(store.order[0]);
        else newChat();
      } else { renderSidebar(); }
    }

    function commitDraftIfNeeded() {
      if (draftChat && currentId === draftChat.id) {
        store.chats[draftChat.id] = draftChat;
        store.order.unshift(draftChat.id);
        draftChat = null;
      }
    }

    function lastSlugInChat() {
      const chat = currentChat();
      if (!chat) return 'Alafasy';
      for (let i = chat.messages.length - 1; i >= 0; i--)
        if (chat.messages[i].spec) return chat.messages[i].spec.slug;
      return 'Alafasy';
    }

    function send(text) {
      text = (text || '').trim();
      if (!text) return;
      if (!currentChat()) newChat();

      const defSlug = lastSlugInChat();
      const chat = currentChat();
      chat.messages.push({ role: 'user', text });

      const parsed = parseCommand(text, defSlug);
      let assistant;
      if (parsed.error) {
        assistant = { role: 'assistant', error: true,
          summary: "I couldn't find a surah/verse in that. Try e.g. “Al-Araf 132-134 on repeat at 1.5x”, “2:255”, or a name like “Ya-Sin”." };
      } else {
        assistant = { role: 'assistant', spec: parsed.spec, summary: specSummary(parsed.spec) };
      }
      chat.messages.push(assistant);

      // Title from first user message.
      if (chat.title === 'New chat') chat.title = text.length > 42 ? text.slice(0, 42) + '…' : text;

      commitDraftIfNeeded();
      saveStore();
      renderSidebar();
      const lastCard = renderMessages();

      if (assistant.spec && lastCard) activate(lastCard, true);
    }

    /* ══════════════════════════════════════════════════════════════
       Wiring
    ══════════════════════════════════════════════════════════════ */
    const sidebar = document.getElementById('sidebar');
    const backdrop = document.getElementById('backdrop');
    function openSidebarMobile() { sidebar.classList.add('open'); backdrop.classList.add('show'); }
    function closeSidebarMobile() { sidebar.classList.remove('open'); backdrop.classList.remove('show'); }

    document.getElementById('newChatBtn').addEventListener('click', newChat);
    document.getElementById('menuBtn').addEventListener('click', openSidebarMobile);
    backdrop.addEventListener('click', closeSidebarMobile);
    document.getElementById('sendBtn').addEventListener('click', () => { const v = composer.value; composer.value = ''; send(v); });
    composer.addEventListener('keydown', e => {
      if (e.key === 'Enter') { e.preventDefault(); const v = composer.value; composer.value = ''; send(v); }
    });

    /* ── Boot ── */
    loadStore();
    renderSidebar();
    if (store.order.length) { currentId = store.order[0]; renderMessages(); }
    else newChat();
  </script>
</body>
</html>
