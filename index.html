<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quran Audio Player</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,300;0,400;0,500;1,400&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #0d0d0d;
      --bg-card: #131313;
      --text: #e8e8e8;
      --text-muted: #777;
      --text-arabic: #f0ead6;
      --border: rgba(255, 255, 255, 0.1);
      --accent: #c8a96e;
      --error: #e05c5c;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'IBM Plex Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2.5rem 1rem 4rem;
    }

    .container {
      width: 100%;
      max-width: 660px;
    }

    /* ── Header ── */
    header {
      text-align: center;
      margin-bottom: 2.75rem;
    }

    header h1 {
      font-size: 1.5rem;
      font-weight: 400;
      letter-spacing: 0.06em;
      color: var(--accent);
    }

    header p {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 0.4rem;
      letter-spacing: 0.03em;
    }

    /* ── Search row ── */
    .search-row {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1rem;
    }

    .verse-input {
      flex: 1;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.7rem 1rem;
      color: var(--text);
      font-family: 'IBM Plex Sans', monospace;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .verse-input::placeholder { color: var(--text-muted); }
    .verse-input:focus { border-color: rgba(200, 169, 110, 0.6); }

    .search-play-btn {
      background: var(--accent);
      border: none;
      border-radius: 8px;
      padding: 0.7rem 1.4rem;
      color: #0d0d0d;
      font-family: 'IBM Plex Sans', sans-serif;
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
      transition: opacity 0.2s;
      white-space: nowrap;
    }

    .search-play-btn:hover { opacity: 0.82; }

    /* ── Quick verses ── */
    .quick-verses {
      display: flex;
      flex-wrap: wrap;
      gap: 0.45rem;
      margin-bottom: 1.75rem;
    }

    .quick-btn {
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 0.28rem 0.75rem;
      color: var(--text-muted);
      font-family: 'IBM Plex Sans', monospace;
      font-size: 0.78rem;
      cursor: pointer;
      transition: all 0.18s;
    }

    .quick-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    /* ── Reciter chips ── */
    .section-label {
      font-size: 0.7rem;
      letter-spacing: 0.09em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 0.55rem;
    }

    .reciters {
      display: flex;
      flex-wrap: wrap;
      gap: 0.45rem;
      margin-bottom: 2rem;
    }

    .reciter-chip {
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 0.32rem 0.85rem;
      color: var(--text-muted);
      font-family: 'IBM Plex Sans', sans-serif;
      font-size: 0.82rem;
      cursor: pointer;
      transition: all 0.18s;
    }

    .reciter-chip:hover {
      border-color: rgba(255, 255, 255, 0.28);
      color: var(--text);
    }

    .reciter-chip.active {
      background: #e8e8e8;
      border-color: #e8e8e8;
      color: #0d0d0d;
      font-weight: 500;
    }

    /* ── Status / error ── */
    .status {
      display: none;
      text-align: center;
      font-size: 0.83rem;
      padding: 0.7rem 1rem;
      border-radius: 8px;
      margin-bottom: 1.25rem;
    }

    .status.loading {
      display: block;
      color: var(--text-muted);
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border);
    }

    .status.error {
      display: block;
      color: var(--error);
      background: rgba(224, 92, 92, 0.07);
      border: 1px solid rgba(224, 92, 92, 0.2);
    }

    /* ── Now-playing card ── */
    .now-playing {
      display: none;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.6rem;
    }

    .now-playing.visible { display: block; }

    .verse-meta {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 0.75rem;
      margin-bottom: 1.4rem;
    }

    .verse-ref {
      font-family: 'IBM Plex Sans', monospace;
      font-size: 0.9rem;
      font-weight: 500;
      color: var(--accent);
    }

    .verse-sub {
      display: block;
      font-family: 'IBM Plex Sans', sans-serif;
      font-size: 0.72rem;
      color: var(--text-muted);
      margin-top: 0.15rem;
    }

    .reciter-display {
      font-size: 0.78rem;
      color: var(--text-muted);
      text-align: right;
      white-space: nowrap;
    }

    /* ── Arabic block ── */
    .arabic-block {
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      padding: 1.5rem 0.25rem;
      margin-bottom: 1.2rem;
      text-align: right;
    }

    .arabic-text {
      font-family: 'IBM Plex Sans Arabic', sans-serif;
      font-size: 2rem;
      font-weight: 400;
      line-height: 1.85;
      color: var(--text-arabic);
      direction: rtl;
    }

    .translation-text {
      font-size: 0.88rem;
      line-height: 1.75;
      color: var(--text-muted);
      font-style: italic;
    }

    /* ── Audio controls ── */
    .audio-controls {
      margin-top: 1.4rem;
      padding-top: 1.2rem;
      border-top: 1px solid var(--border);
    }

    .controls-buttons {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1.1rem;
      margin-bottom: 1rem;
    }

    .ctrl-btn {
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 50%;
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text);
      cursor: pointer;
      transition: all 0.18s;
      flex-shrink: 0;
    }

    .ctrl-btn:hover {
      border-color: rgba(255, 255, 255, 0.28);
      background: rgba(255, 255, 255, 0.04);
    }

    .ctrl-btn.primary {
      width: 50px;
      height: 50px;
      background: var(--accent);
      border-color: var(--accent);
      color: #0d0d0d;
    }

    .ctrl-btn.primary:hover {
      opacity: 0.82;
      background: var(--accent);
      border-color: var(--accent);
    }

    .ctrl-btn.active {
      border-color: var(--accent);
      color: var(--accent);
      background: rgba(200, 169, 110, 0.08);
    }

    /* ── Seek bar ── */
    .seek-row {
      display: flex;
      align-items: center;
      gap: 0.7rem;
    }

    .time {
      font-family: 'IBM Plex Sans', monospace;
      font-size: 0.72rem;
      color: var(--text-muted);
      white-space: nowrap;
      min-width: 36px;
    }

    .time.end { text-align: right; }

    .seek-bar {
      flex: 1;
      -webkit-appearance: none;
      appearance: none;
      height: 3px;
      background: rgba(255, 255, 255, 0.12);
      border-radius: 2px;
      outline: none;
      cursor: pointer;
    }

    .seek-bar::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 13px;
      height: 13px;
      border-radius: 50%;
      background: var(--accent);
      cursor: pointer;
    }

    .seek-bar::-moz-range-thumb {
      width: 13px;
      height: 13px;
      border-radius: 50%;
      background: var(--accent);
      cursor: pointer;
      border: none;
    }

    /* ── Responsive ── */
    @media (max-width: 480px) {
      body { padding: 1.75rem 0.85rem 3rem; }
      .arabic-text { font-size: 1.6rem; }
      .reciters { gap: 0.4rem; }
      .quick-verses { gap: 0.4rem; }
    }
  </style>
</head>
<body>
  <div class="container">

    <header>
      <h1>Quran Audio Player</h1>
      <p>Type a surah name or number, a verse, or a range</p>
    </header>

    <!-- Verse input -->
    <div class="search-row">
      <input id="verseInput" class="verse-input" type="text"
             placeholder="Al-Araf 132-134  ·  7:132  ·  2:255"
             autocomplete="off" spellcheck="false">
      <button id="searchPlayBtn" class="search-play-btn">Play</button>
    </div>

    <!-- Quick verses -->
    <div class="quick-verses" id="quickVerses">
      <button class="quick-btn" data-ref="1:1-7">Al-Fatihah</button>
      <button class="quick-btn" data-ref="2:255">2:255</button>
      <button class="quick-btn" data-ref="7:132-134">Al-Araf 132-134</button>
      <button class="quick-btn" data-ref="36:1-5">Ya-Sin</button>
      <button class="quick-btn" data-ref="55:1-13">Ar-Rahman</button>
      <button class="quick-btn" data-ref="112:1-4">Al-Ikhlas</button>
      <button class="quick-btn" data-ref="114:1-6">An-Nas</button>
    </div>

    <!-- Reciter selector -->
    <div class="section-label">Reciter</div>
    <div class="reciters" id="reciters">
      <button class="reciter-chip active" data-slug="Alafasy">Mishary Alafasy</button>
      <button class="reciter-chip" data-slug="AbdulBaset">Abdul Basit</button>
      <button class="reciter-chip" data-slug="Husary">Mahmoud Al-Husary</button>
      <button class="reciter-chip" data-slug="AbuBakrShatri">Abu Bakr Al-Shatri</button>
    </div>

    <!-- Status / error banner -->
    <div class="status" id="status"></div>

    <!-- Now-playing card -->
    <div class="now-playing" id="nowPlaying">
      <div class="verse-meta">
        <span class="verse-ref" id="displayRef">
          <span id="displayRefMain"></span>
          <span class="verse-sub" id="displaySub"></span>
        </span>
        <span class="reciter-display" id="displayReciter"></span>
      </div>

      <div class="arabic-block">
        <div class="arabic-text" id="arabicText" lang="ar" dir="rtl"></div>
      </div>

      <div class="translation-text" id="translationText"></div>

      <div class="audio-controls">
        <div class="controls-buttons">
          <!-- Prev -->
          <button class="ctrl-btn" id="prevBtn" title="Previous ayah">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round">
              <polygon points="19 20 9 12 19 4 19 20"/>
              <line x1="5" y1="19" x2="5" y2="5"/>
            </svg>
          </button>

          <!-- Play / Pause -->
          <button class="ctrl-btn primary" id="playPauseBtn" title="Play / Pause">
            <svg id="iconPlay" width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
              <polygon points="5 3 19 12 5 21 5 3"/>
            </svg>
            <svg id="iconPause" width="18" height="18" viewBox="0 0 24 24"
                 fill="currentColor" style="display:none">
              <rect x="6" y="4" width="4" height="16"/>
              <rect x="14" y="4" width="4" height="16"/>
            </svg>
          </button>

          <!-- Next -->
          <button class="ctrl-btn" id="nextBtn" title="Next ayah">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round">
              <polygon points="5 4 15 12 5 20 5 4"/>
              <line x1="19" y1="5" x2="19" y2="19"/>
            </svg>
          </button>

          <!-- Repeat -->
          <button class="ctrl-btn" id="repeatBtn" title="Repeat verse / range">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round">
              <polyline points="17 1 21 5 17 9"/>
              <path d="M3 11V9a4 4 0 0 1 4-4h14"/>
              <polyline points="7 23 3 19 7 15"/>
              <path d="M21 13v2a4 4 0 0 1-4 4H3"/>
            </svg>
          </button>
        </div>

        <!-- Seek bar -->
        <div class="seek-row">
          <span class="time" id="currentTime">0:00</span>
          <input class="seek-bar" id="seekBar" type="range"
                 min="0" max="100" value="0" step="0.1">
          <span class="time end" id="totalTime">0:00</span>
        </div>
      </div>
    </div>

  </div>

  <audio id="audio" preload="none"></audio>

  <script>
    /* ────────────────────────────────────────────────────────────
       Reciters. Each lists candidate audio sources tried in order —
       everyayah.com folders first (stable, CORS-friendly), then the
       quran.com CDN path as a fallback. Whichever loads first wins.
    ──────────────────────────────────────────────────────────── */
    const RECITERS = {
      Alafasy: {
        name: 'Mishary Alafasy',
        everyayah: ['Alafasy_128kbps'],
        qcom: 'Alafasy',
      },
      AbdulBaset: {
        name: 'Abdul Basit',
        everyayah: ['Abdul_Basit_Murattal_64kbps', 'Abdul_Basit_Murattal_192kbps'],
        qcom: 'AbdulBaset/Murattal',
      },
      Husary: {
        name: 'Mahmoud Al-Husary',
        everyayah: ['Husary_128kbps', 'Husary_64kbps'],
        qcom: 'Husary',
      },
      AbuBakrShatri: {
        name: 'Abu Bakr Al-Shatri',
        everyayah: ['Abu_Bakr_Ash-Shaatree_128kbps', 'Abu_Bakr_Ash-Shaatree_64kbps'],
        qcom: 'Shatri',
      },
    };

    /* ────────────────────────────────────────────────────────────
       Surah names (1–114) for name/number resolution
    ──────────────────────────────────────────────────────────── */
    const SURAH_NAMES = [
      null,
      'Al-Fatihah','Al-Baqarah','Ali ‘Imran','An-Nisa','Al-Ma’idah',
      'Al-An’am','Al-A’raf','Al-Anfal','At-Tawbah','Yunus',
      'Hud','Yusuf','Ar-Ra’d','Ibrahim','Al-Hijr',
      'An-Nahl','Al-Isra','Al-Kahf','Maryam','Ta-Ha',
      'Al-Anbiya','Al-Hajj','Al-Mu’minun','An-Nur','Al-Furqan',
      'Ash-Shu’ara','An-Naml','Al-Qasas','Al-‘Ankabut','Ar-Rum',
      'Luqman','As-Sajdah','Al-Ahzab','Saba','Fatir',
      'Ya-Sin','As-Saffat','Sad','Az-Zumar','Ghafir',
      'Fussilat','Ash-Shura','Az-Zukhruf','Ad-Dukhan','Al-Jathiyah',
      'Al-Ahqaf','Muhammad','Al-Fath','Al-Hujurat','Qaf',
      'Adh-Dhariyat','At-Tur','An-Najm','Al-Qamar','Ar-Rahman',
      'Al-Waqi’ah','Al-Hadid','Al-Mujadila','Al-Hashr','Al-Mumtahanah',
      'As-Saff','Al-Jumu’ah','Al-Munafiqun','At-Taghabun','At-Talaq',
      'At-Tahrim','Al-Mulk','Al-Qalam','Al-Haqqah','Al-Ma’arij',
      'Nuh','Al-Jinn','Al-Muzzammil','Al-Muddaththir','Al-Qiyamah',
      'Al-Insan','Al-Mursalat','An-Naba','An-Nazi’at','‘Abasa',
      'At-Takwir','Al-Infitar','Al-Mutaffifin','Al-Inshiqaq','Al-Buruj',
      'At-Tariq','Al-A’la','Al-Ghashiyah','Al-Fajr','Al-Balad',
      'Ash-Shams','Al-Layl','Ad-Duha','Ash-Sharh','At-Tin',
      'Al-‘Alaq','Al-Qadr','Al-Bayyinah','Az-Zalzalah','Al-‘Adiyat',
      'Al-Qari’ah','At-Takathur','Al-‘Asr','Al-Humazah','Al-Fil',
      'Quraysh','Al-Ma’un','Al-Kawthar','Al-Kafirun','An-Nasr',
      'Al-Masad','Al-Ikhlas','Al-Falaq','An-Nas',
    ];

    // Build a normalized-name → number lookup, plus article-stripped variants.
    const NAME_LOOKUP = (() => {
      const map = {};
      const norm = s => s.toLowerCase().replace(/[^a-z0-9]/g, '');
      // Longest first so 'ash'/'adh'/'ath' win over 'as'/'ad'/'at'.
      const articles = ['ash', 'adh', 'ath', 'al', 'ad', 'ar', 'as', 'at', 'an', 'az'];
      const strip = n => {
        for (const a of articles) {
          if (n.startsWith(a) && n.length > a.length + 1) return n.slice(a.length);
        }
        return n;
      };
      for (let i = 1; i < SURAH_NAMES.length; i++) {
        const n = norm(SURAH_NAMES[i]);
        if (!(n in map)) map[n] = i;
        const s = strip(n);
        if (!(s in map)) map[s] = i;
      }
      // Handy aliases people actually type.
      const aliases = {
        yaseen: 36, yasin: 36, taha: 20, fatiha: 1, fatihah: 1,
        ikhlas: 112, kafiroon: 109, muminoon: 23, imran: 3,
        alimran: 3, aleimran: 3, kursi: 2, ayatulkursi: 2,
      };
      for (const k in aliases) if (!(k in map)) map[k] = aliases[k];
      return map;
    })();

    function resolveSurah(token) {
      const t = token.trim();
      if (!t) return null;
      if (/^\d+$/.test(t)) {
        const n = parseInt(t, 10);
        return (n >= 1 && n <= 114) ? n : null;
      }
      let key = t.toLowerCase().replace(/[^a-z0-9]/g, '');
      // drop a leading "surah"/"sura"/"surat"/"chapter" prefix
      key = key.replace(/^(surahs?|surat|chapters?|chap)/, '') || key;
      if (key in NAME_LOOKUP) return NAME_LOOKUP[key];
      // try stripping a leading article on the user's input too
      const articles = ['ash', 'adh', 'ath', 'al', 'ad', 'ar', 'as', 'at', 'an', 'az'];
      for (const a of articles) {
        if (key.startsWith(a)) {
          const s = key.slice(a.length);
          if (s in NAME_LOOKUP) return NAME_LOOKUP[s];
        }
      }
      return null;
    }

    /* ────────────────────────────────────────────────────────────
       Parse the search box:
         "7:132"  "7:132-134"  "Al-Araf 132"  "Al-Araf 132 to 134"
         "36"     "2 255"      "ya-sin 1-5"
    ──────────────────────────────────────────────────────────── */
    function parseInput(raw) {
      let s = (raw || '').trim();
      if (!s) return null;
      // drop leading command words people say out loud: "play …", "recite …"
      s = s.replace(/^\s*(please\s+)?(play|recite|read|listen(\s+to)?|open|start|put\s+on)\s+/i, '');
      s = s.replace(/\bto\b/gi, '-').replace(/[–—]/g, '-');

      let surahTok, ayahPart;
      const colon = s.indexOf(':');
      if (colon !== -1) {
        surahTok = s.slice(0, colon).trim();
        ayahPart = s.slice(colon + 1).trim();
      } else {
        const m = s.match(/\d+/);
        if (!m) {
          // name only → whole surah (ayah 1)
          const only = resolveSurah(s);
          return only ? { surah: only, start: 1, end: 1 } : null;
        }
        const before = s.slice(0, m.index).trim();
        if (before) {
          surahTok = before;
          ayahPart = s.slice(m.index).trim();
        } else {
          surahTok = m[0];
          ayahPart = s.slice(m.index + m[0].length).trim();
        }
      }

      const surah = resolveSurah(surahTok);
      if (!surah) return null;

      const nums = ayahPart.match(/\d+/g);
      if (!nums || nums.length === 0) return { surah, start: 1, end: 1 };

      let start = parseInt(nums[0], 10);
      let end = start;
      if (/-/.test(ayahPart) && nums.length >= 2) {
        end = parseInt(nums[nums.length - 1], 10);
      }
      if (!Number.isInteger(start) || start < 1) return null;
      if (end < start) end = start;
      if (end - start > 285) end = start + 285;   // longest surah is 286 ayahs
      return { surah, start, end };
    }

    /* ────────────────────────────────────────────────────────────
       State
    ──────────────────────────────────────────────────────────── */
    let playlist    = [];        // [{ surah, ayah }]
    let plIndex     = 0;
    let repeat      = false;
    let currentSlug = 'Alafasy';
    let isSeeking   = false;
    let loadToken   = 0;         // guards against out-of-order async loads
    let audioCands  = [];        // candidate audio URLs for the current ayah
    let candIndex   = 0;         // which candidate we're currently trying
    let intendPlay  = true;      // whether the user wants playback right now

    /* ────────────────────────────────────────────────────────────
       Element refs
    ──────────────────────────────────────────────────────────── */
    const verseInput    = document.getElementById('verseInput');
    const searchPlayBtn = document.getElementById('searchPlayBtn');
    const statusEl      = document.getElementById('status');
    const nowPlaying    = document.getElementById('nowPlaying');
    const displayRefMain= document.getElementById('displayRefMain');
    const displaySub    = document.getElementById('displaySub');
    const displayReciter= document.getElementById('displayReciter');
    const arabicText    = document.getElementById('arabicText');
    const translationEl = document.getElementById('translationText');
    const audio         = document.getElementById('audio');
    const playPauseBtn  = document.getElementById('playPauseBtn');
    const iconPlay      = document.getElementById('iconPlay');
    const iconPause     = document.getElementById('iconPause');
    const prevBtn       = document.getElementById('prevBtn');
    const nextBtn       = document.getElementById('nextBtn');
    const repeatBtn     = document.getElementById('repeatBtn');
    const seekBar       = document.getElementById('seekBar');
    const currentTimeEl = document.getElementById('currentTime');
    const totalTimeEl   = document.getElementById('totalTime');

    /* ────────────────────────────────────────────────────────────
       Helpers
    ──────────────────────────────────────────────────────────── */
    const pad3 = n => String(n).padStart(3, '0');

    function formatTime(sec) {
      if (!isFinite(sec) || isNaN(sec)) return '0:00';
      const m = Math.floor(sec / 60);
      const s = Math.floor(sec % 60);
      return `${m}:${String(s).padStart(2, '0')}`;
    }

    function stripHtml(raw) {
      return raw
        .replace(/<[^>]+>/g, '')
        .replace(/\[\d+\]/g, '')
        .trim();
    }

    function setStatus(msg, type) {
      statusEl.textContent = msg;
      statusEl.className   = `status ${type}`;
    }

    function clearStatus() {
      statusEl.textContent = '';
      statusEl.className   = 'status';
    }

    function setPlayingState(playing) {
      iconPlay.style.display  = playing ? 'none' : '';
      iconPause.style.display = playing ? ''     : 'none';
    }

    function resetSeek() {
      seekBar.value             = 0;
      currentTimeEl.textContent = '0:00';
      totalTimeEl.textContent   = '0:00';
    }

    // Ordered list of audio URLs to try for one ayah/reciter.
    function buildCandidates(surah, ayah, slug) {
      const r = RECITERS[slug] || {};
      const p = pad3(surah) + pad3(ayah);
      const list = [];
      (r.everyayah || []).forEach(f => list.push(`https://everyayah.com/data/${f}/${p}.mp3`));
      if (r.qcom) list.push(`https://verses.quran.com/${r.qcom}/mp3/${p}.mp3`);
      return list;
    }

    // Point the audio element at the current candidate; play if intended.
    function playCandidate() {
      if (candIndex >= audioCands.length) return;
      audio.src = audioCands[candIndex];
      audio.load();
      if (intendPlay) {
        audio.play().then(() => setPlayingState(true)).catch(() => {});
      }
    }

    /* ────────────────────────────────────────────────────────────
       API: verse text + reciter-correct audio URL
    ──────────────────────────────────────────────────────────── */
    async function fetchVerseData(surah, ayah) {
      const url = `https://api.qurancdn.com/api/qdc/verses/by_key/${surah}:${ayah}`
                + `?language=en&words=false&translations=131&fields=text_uthmani`;
      const res = await fetch(url);
      if (!res.ok) throw new Error(`API ${res.status}`);
      const { verse } = await res.json();
      return {
        arabic:      verse.text_uthmani || '',
        translation: verse.translations?.[0]?.text
                       ? stripHtml(verse.translations[0].text)
                       : '',
      };
    }

    /* ────────────────────────────────────────────────────────────
       Playlist + loading
    ──────────────────────────────────────────────────────────── */
    function startPlaylist(surah, start, end, autoplay = true) {
      playlist = [];
      for (let a = start; a <= end; a++) playlist.push({ surah, ayah: a });
      plIndex = 0;
      loadCurrent(autoplay);
    }

    async function loadCurrent(autoplay = true) {
      const item = playlist[plIndex];
      if (!item) return;
      const { surah, ayah } = item;
      const myToken = ++loadToken;

      audio.pause();
      audio.removeAttribute('src');
      resetSeek();
      setPlayingState(false);
      setStatus('Loading…', 'loading');

      let verseData;
      try {
        verseData = await fetchVerseData(surah, ayah);
      } catch (err) {
        if (myToken !== loadToken) return;
        setStatus('Could not fetch verse data. Check your connection and try again.', 'error');
        return;
      }
      if (myToken !== loadToken) return;   // a newer load superseded this one

      // Set up the audio candidate chain and start the first one.
      audioCands = buildCandidates(surah, ayah, currentSlug);
      candIndex  = 0;
      intendPlay = autoplay;
      playCandidate();

      // Card
      const name  = SURAH_NAMES[surah] || `Surah ${surah}`;
      const first = playlist[0].ayah;
      const last  = playlist[playlist.length - 1].ayah;

      displayRefMain.textContent = `${surah}:${ayah}`;
      displaySub.textContent = playlist.length > 1
        ? `${name} · ayah ${ayah} of ${first}–${last}`
        : name;
      displayReciter.textContent = RECITERS[currentSlug]?.name || currentSlug;
      arabicText.textContent     = verseData.arabic;
      translationEl.textContent  = verseData.translation;

      nowPlaying.classList.add('visible');
      clearStatus();
    }

    /* ────────────────────────────────────────────────────────────
       Search box
    ──────────────────────────────────────────────────────────── */
    function handleSearch() {
      const parsed = parseInput(verseInput.value);
      if (!parsed) {
        setStatus(
          'Could not read that. Try a surah name or number, a verse, or a range — e.g. ' +
          '“Al-Araf 132-134”, “7:132”, or “2:255”.',
          'error'
        );
        return;
      }
      startPlaylist(parsed.surah, parsed.start, parsed.end);
    }

    /* ────────────────────────────────────────────────────────────
       Audio element events
    ──────────────────────────────────────────────────────────── */
    audio.addEventListener('error', () => {
      if (!audio.src) return;   // ignore the reset that clears src
      // Failover: try the next candidate source before giving up.
      if (candIndex < audioCands.length - 1) {
        candIndex++;
        playCandidate();
        return;
      }
      setStatus(
        'Could not load audio for this verse from any source. Trying a different reciter may help.',
        'error'
      );
      setPlayingState(false);
    });

    audio.addEventListener('timeupdate', () => {
      if (isSeeking || !isFinite(audio.duration)) return;
      seekBar.value             = (audio.currentTime / audio.duration) * 100;
      currentTimeEl.textContent = formatTime(audio.currentTime);
    });

    audio.addEventListener('durationchange', () => {
      if (isFinite(audio.duration)) totalTimeEl.textContent = formatTime(audio.duration);
    });

    audio.addEventListener('ended', () => {
      if (plIndex < playlist.length - 1) {
        plIndex++;
        loadCurrent(true);
      } else if (repeat) {
        plIndex = 0;
        loadCurrent(true);
      } else {
        setPlayingState(false);
        resetSeek();
      }
    });

    audio.addEventListener('play',  () => setPlayingState(true));
    audio.addEventListener('pause', () => setPlayingState(false));

    /* ────────────────────────────────────────────────────────────
       Seek bar
    ──────────────────────────────────────────────────────────── */
    seekBar.addEventListener('mousedown',  () => { isSeeking = true; });
    seekBar.addEventListener('touchstart', () => { isSeeking = true; }, { passive: true });

    seekBar.addEventListener('input', () => {
      if (isFinite(audio.duration)) {
        currentTimeEl.textContent = formatTime((seekBar.value / 100) * audio.duration);
      }
    });

    seekBar.addEventListener('change', () => {
      isSeeking = false;
      if (isFinite(audio.duration)) {
        audio.currentTime = (seekBar.value / 100) * audio.duration;
      }
    });

    /* ────────────────────────────────────────────────────────────
       Transport buttons
    ──────────────────────────────────────────────────────────── */
    playPauseBtn.addEventListener('click', () => {
      if (!playlist.length || !audio.src) return;
      if (audio.paused) {
        audio.play().then(() => setPlayingState(true)).catch(() => {});
      } else {
        audio.pause();
      }
    });

    prevBtn.addEventListener('click', () => {
      if (!playlist.length) return;
      if (plIndex > 0) {
        plIndex--;
        loadCurrent(true);
      } else {
        const cur = playlist[0];
        if (cur.ayah > 1) startPlaylist(cur.surah, cur.ayah - 1, cur.ayah - 1);
      }
    });

    nextBtn.addEventListener('click', () => {
      if (!playlist.length) return;
      if (plIndex < playlist.length - 1) {
        plIndex++;
        loadCurrent(true);
      } else {
        const cur = playlist[plIndex];
        startPlaylist(cur.surah, cur.ayah + 1, cur.ayah + 1);
      }
    });

    repeatBtn.addEventListener('click', () => {
      repeat = !repeat;
      repeatBtn.classList.toggle('active', repeat);
      repeatBtn.title = repeat ? 'Repeat: on' : 'Repeat verse / range';
    });

    /* ────────────────────────────────────────────────────────────
       Reciter chips
    ──────────────────────────────────────────────────────────── */
    document.getElementById('reciters').addEventListener('click', e => {
      const chip = e.target.closest('.reciter-chip');
      if (!chip) return;

      document.querySelectorAll('.reciter-chip').forEach(c => c.classList.remove('active'));
      chip.classList.add('active');
      currentSlug = chip.dataset.slug;

      if (playlist.length) loadCurrent(true);   // reload current ayah with new reciter
    });

    /* ────────────────────────────────────────────────────────────
       Quick-verse buttons
    ──────────────────────────────────────────────────────────── */
    document.getElementById('quickVerses').addEventListener('click', e => {
      const btn = e.target.closest('.quick-btn');
      if (!btn) return;
      const parsed = parseInput(btn.dataset.ref);
      if (!parsed) return;
      verseInput.value = btn.dataset.ref;
      startPlaylist(parsed.surah, parsed.start, parsed.end);
    });

    /* ────────────────────────────────────────────────────────────
       Keyboard
    ──────────────────────────────────────────────────────────── */
    verseInput.addEventListener('keydown', e => {
      if (e.key === 'Enter') handleSearch();
    });

    searchPlayBtn.addEventListener('click', handleSearch);
  </script>
</body>
</html>
